services:
  - type: web
    name: sentiment-analyzer-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentiment-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: sentiment-db
    plan: free
